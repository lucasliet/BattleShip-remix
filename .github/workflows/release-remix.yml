name: Release (Remix)

# BattleShip-remix fork release: BattleShip-Remix for macOS, Linux, Windows, Nintendo Switch, Android and PS5.
#
# Triggered by a tag v* (for example v2.0.1-port.1), or by hand to test the builds (no Release is created then).
# The release lands as a draft whose body is .github/release-notes.md plus the generated changelog; write the
# Highlights section, then publish it.
#
# No game data is produced here: the desktop builds extract BattleShip-Remix.o2r from the user's ROM on first run,
# and the Switch package needs the .o2r that the desktop build made (see the release notes).
# The inherited upstream workflows (release.yml, build.yml, build-switch.yml, build-uwp.yml, readme-stats.yml) are
# disabled in the fork's Actions settings.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SSB64_VERSION: remix

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # git describe --tags gives the updater version
      - name: Install build deps
        run: |
          brew install cmake ninja \
            sdl2 glew libzip nlohmann-json tinyxml2 spdlog \
            zip create-dmg dylibbundler coreutils
          python3 -m pip install --break-system-packages Pillow
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-remix-macos
          max-size: 2G
      - name: Package macOS .app + .dmg (ad-hoc signed, not notarized)
        env:
          DMG_STYLED: "1"
          DMG_TIMEOUT: "300"
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remix-macos
          path: |
            dist/BattleShip-Remix.dmg
            dist/BattleShip-Remix-macos.zip
          if-no-files-found: error

  build-linux:
    # jammy (glibc 2.35) so the AppImage runs on Steam Deck, Debian 12, Fedora 38+ and Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-remix-linux
          max-size: 2G
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build zip clang \
            libsdl2-dev libzip-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            python3 python3-pil imagemagick file
          # libzip's CMake config lists CLI tools that Ubuntu does not package.
          sudo touch /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
          sudo chmod +x /usr/bin/zipcmp /usr/bin/zipmerge /usr/bin/ziptool
      - name: Use clang
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install AppImage tooling
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O /usr/local/bin/linuxdeploy
          chmod +x /usr/local/bin/appimagetool /usr/local/bin/linuxdeploy
      - name: Package Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remix-linux
          path: dist/BattleShip-Remix-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build deps
        run: |
          choco install ninja -y
          python -m pip install --upgrade pip
          python -m pip install Pillow
        shell: pwsh
      - name: Package Windows zip
        env:
          SSB64_ENABLE_SCRIPTING: "0"
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: remix-windows
          path: dist/BattleShip-Remix-windows-x64.zip
          if-no-files-found: error

  build-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: devkitpro/devkita64:20260219   # date-pinned
    steps:
      - name: Install host deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil zip git
          # The switch-tinyxml2 portlib is too old for libultraship; its FetchContent copy is used instead.
          dkp-pacman -R --noconfirm switch-tinyxml2 || true
          # libcurl powers the in-game Switch updater; the image normally ships it already.
          test -f /opt/devkitpro/portlibs/switch/lib/libcurl.a || dkp-pacman -Sy --noconfirm switch-curl
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Mark the checkout safe for git describe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-remix-switch
      - name: Configure
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          cmake -S . -B build-switch -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBATTLESHIP_SWITCH=ON \
            -DDISABLE_SCRIPTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSSB64_VERSION=remix
      - name: Build NRO
        env:
          DEVKITPRO: /opt/devkitpro
        run: cmake --build build-switch --target ssb64_nro -j "$(nproc)"
      - name: Package SD card folder
        run: |
          app=BattleShip-Remix
          dir="dist/switch/SD/switch/$app"
          mkdir -p "$dir"
          cp "build-switch/$app.nro" "$dir/"
          # The bare .nro is its own release asset: the in-game updater downloads it and swaps the running file.
          cp "build-switch/$app.nro" dist/
          (cd libultraship/src/fast && cmake -E tar cf "$GITHUB_WORKSPACE/$dir/f3d.o2r" --format=zip shaders)
          cp gamecontrollerdb.txt config.yml "$dir/"
          cp -a assets "$dir/"
          cat > "$dir/README.txt" <<EOF
          $app for Nintendo Switch (homebrew)

          1. Copy the switch/ folder to the root of the SD card.
          2. Add your own BattleShip-Remix.o2r and BattleShip-Remix.o2r.recipe to switch/$app/.
             They are not included: run the desktop build once with your Smash Remix 2.0.1 ROM and
             copy the two files it extracts (its app data folder) to this folder.
          3. Launch from the Homebrew Menu in full-memory mode (hold R while opening an installed game).
             Applet mode does not have enough memory.
          EOF
          (cd dist/switch/SD && zip -qr "$GITHUB_WORKSPACE/dist/$app-switch.zip" switch)
      - uses: actions/upload-artifact@v4
        with:
          name: remix-switch
          path: |
            dist/BattleShip-Remix-switch.zip
            dist/BattleShip-Remix.nro
          if-no-files-found: error

  build-android:
    # arm64-v8a only: the Remix C is not verified on ILP32 (armeabi-v7a) yet.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Pillow for CSS asset baking
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Install Android SDK + NDK r29
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865'
      - name: Generate f3d.o2r
        working-directory: libultraship/src/fast
        run: cmake -E tar cf "$GITHUB_WORKSPACE/f3d.o2r" --format=zip shaders
      - name: Decode release keystore (if configured via secrets)
        env:
          SSB64_ANDROID_KEYSTORE_BASE64:   ${{ secrets.SSB64_ANDROID_KEYSTORE_BASE64 }}
          SSB64_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SSB64_ANDROID_KEYSTORE_PASSWORD }}
          SSB64_ANDROID_KEY_ALIAS:         ${{ secrets.SSB64_ANDROID_KEY_ALIAS }}
          SSB64_ANDROID_KEY_PASSWORD:      ${{ secrets.SSB64_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$SSB64_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore secret configured; falling back to debug signing"
            exit 0
          fi
          echo "$SSB64_ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "SSB64_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/release.jks"
            echo "SSB64_RELEASE_KEYSTORE_PASSWORD=$SSB64_ANDROID_KEYSTORE_PASSWORD"
            echo "SSB64_RELEASE_KEY_ALIAS=$SSB64_ANDROID_KEY_ALIAS"
            echo "SSB64_RELEASE_KEY_PASSWORD=$SSB64_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease -Pssb64.version=remix -Pssb64.abis=arm64-v8a \
            -Pssb64.versionName="$GITHUB_REF_NAME" -Pssb64.versionCode="$(git rev-list --count HEAD)"
      - name: Stage APK
        run: |
          mkdir -p dist
          shopt -s nullglob
          apk=(android/app/build/outputs/apk/release/app-release*.apk)
          if (( ${#apk[@]} == 0 )); then
            echo "::error::no APK produced under android/app/build/outputs/apk/release/"
            exit 1
          fi
          cp "${apk[0]}" dist/BattleShip-Remix-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: remix-android
          path: dist/BattleShip-Remix-android.apk
          if-no-files-found: error

  build-ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Restore the PS5 toolchain
        id: ps5-toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain/ps5
          key: ps5-toolchain-${{ hashFiles('scripts/ps5/packages.lock', 'scripts/ps5/setup-toolchain.sh', 'scripts/ps5/build-gl-sdk.sh') }}
      - name: Set up the PS5 toolchain
        if: steps.ps5-toolchain.outputs.cache-hit != 'true'
        run: |
          scripts/ps5/setup-toolchain.sh
          scripts/ps5/build-gl-sdk.sh
      - name: Refresh the cached PS5 toolchain
        if: steps.ps5-toolchain.outputs.cache-hit == 'true'
        run: scripts/ps5/setup-toolchain.sh --offline
      - name: Build the title
        run: JOBS="$(nproc)" scripts/ps5/build.sh remix
      - name: Package
        run: |
          mkdir -p dist
          # The folder zip (PPSA99264/ at the top) goes to /data/homebrew or an external drive.
          cp build-ps5/ps5-app/dist/PPSA99264.zip dist/BattleShip-Remix-ps5-PPSA99264.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remix-ps5
          path: dist/BattleShip-Remix-ps5-PPSA99264.zip
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [build-macos, build-linux, build-windows, build-switch, build-android, build-ps5]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: (cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          # artifacts/BattleShip-Remix.nro is kept for one transitional release: Switch builds up to
          # v2.0.1-port.9 look for that asset by name. Drop it in the release after the one that ships
          # the zip updater. (A comment inside the block below would be read as a file pattern.)
          files: |
            artifacts/BattleShip-Remix.dmg
            artifacts/BattleShip-Remix-macos.zip
            artifacts/BattleShip-Remix-x86_64.AppImage
            artifacts/BattleShip-Remix-windows-x64.zip
            artifacts/BattleShip-Remix-switch.zip
            artifacts/BattleShip-Remix.nro
            artifacts/BattleShip-Remix-android.apk
            artifacts/BattleShip-Remix-ps5-PPSA99264.zip
            artifacts/SHA256SUMS.txt
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: true
