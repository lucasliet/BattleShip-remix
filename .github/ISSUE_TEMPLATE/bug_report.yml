name: Bug report
description: Something in the game looks or behaves wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reports we can act on need three things: **where** it happens (platform, version, fighter, stage, mode), **how** to make it happen again, and **evidence** (screenshot or video, plus the log).
        "Some characters have bugs" cannot be fixed. "Up smash with Dr. Mario on Dream Land has no hitbox, video attached" can.
        One bug per issue, please.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Nintendo Switch
        - PlayStation 5
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: The version on the device where the problem happens, shown as "Version" in the game menu, for example `v2.0.1-port.7`.
      placeholder: v2.0.1-port.7
    validations:
      required: true
  - type: dropdown
    id: o2r-platform
    attributes:
      label: Switch only, where was the .o2r generated?
      description: The Switch does not read the ROM, so you copy `BattleShip-Remix.o2r` and `BattleShip-Remix.o2r.recipe` from another platform. Say which one made them. Choose "Not on Switch" if your platform is not the Switch.
      options:
        - Not on Switch
        - Windows
        - Linux
        - macOS
        - Android
        - PlayStation 5
        - Other
    validations:
      required: true
  - type: input
    id: o2r-version
    attributes:
      label: Switch only, game version that generated the .o2r
      description: The version shown in the menu of the platform that made the `.o2r`, for example `v2.0.1-port.7`. Write `n/a` if your platform is not the Switch.
      placeholder: v2.0.1-port.7
    validations:
      required: true
  - type: dropdown
    id: rom
    attributes:
      label: ROM
      description: Which ROM did you extract the game data from?
      options:
        - Smash Remix ROM (BattleShip Remix)
        - Super Smash Bros. 64 US (BattleShip)
        - Super Smash Bros. 64 JP
        - Not sure
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Fighter, stage and mode
      description: Name the exact fighter(s), stage and game mode. If it only happens with some of them, list which ones and which ones you checked that are fine.
      placeholder: "Dr. Mario (P1) vs Kirby (CPU), Dream Land, VS mode"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: Numbered steps from a fresh match or menu. Say which inputs you used (for example "hold up and press A on the ground, no C-stick").
      placeholder: |
        1. VS mode, Dr. Mario vs Kirby on Dream Land
        2. Stand on the ground and press up + A
        3. The attack plays but has no hitbox
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Often
        - Rarely
        - Happened once
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Drag a screenshot or a short video here. For a graphics bug, a screenshot is required; for a move or physics bug, a video of the move is required.
        If you can, also show the same thing in the original game or the Smash Remix ROM on an emulator so we know what it should look like.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach the logs from the game folder (the one that holds `BattleShip-Remix.o2r`), right after the bug:
        - `ssb64.log` and `logs/BattleShip-Remix.log` (the engine log): both are overwritten on every launch, so copy them before you open the game again. If one is large (older versions kept growing it), zip it.
        - PS5 only: `boot.txt`, if the game crashed before `ssb64.log` was written. On PS5 the folder is `/data/homebrew/PPSA99264/`.
        If a file does not exist on your platform, skip it. Not needed for a bug that is only about how something looks, but it helps for crashes and freezes.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Controller used, resolution or graphics settings you changed, mods or texture packs loaded, and whether it also happens on another platform.
